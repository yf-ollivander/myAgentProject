spring:
  application:
    name: jeecg-system
  config:
    import: optional:classpath:config/application-liteflow.yml
  profiles:
    active: '@profile.name@'

ai:
  agent:
    # Credentials remain unusable until deployment injects a stable 32-byte key.
    secret-key: ${AI_CONFIG_SECRET_KEY:}
    callback-base-url: ${AI_CALLBACK_BASE_URL:}
    feishu-api-base-url: ${AI_FEISHU_API_BASE_URL:https://open.feishu.cn}
    mock-enabled: ${AI_MOCK_AGENT_ENABLED:false}
    # update-begin---author:Codex ---date:2026-08-11  for：【REQ-HTTP-MODEL-20260810】环境变量优先，缺失时仅允许官方模型域名-----------
    allowed-hosts: ${AI_AGENT_ALLOWED_HOSTS:api.openai.com,api.deepseek.com,api.anthropic.com,generativelanguage.googleapis.com}
    # update-end---author:Codex ---date:2026-08-11  for：【REQ-HTTP-MODEL-20260810】环境变量优先，缺失时仅允许官方模型域名-----------
  executor:
    # update-begin---author:Codex ---date:2026-08-11  for：【REQ-HTTP-MODEL-20260810】未提供环境变量时默认启用统一 HTTP Gateway-----------
    gateway: ${AI_EXECUTOR_GATEWAY:http}
    # update-end---author:Codex ---date:2026-08-11  for：【REQ-HTTP-MODEL-20260810】未提供环境变量时默认启用统一 HTTP Gateway-----------
